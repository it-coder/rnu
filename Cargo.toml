[package]
name = "rnu"
version = "0.3.0"
edition = "2021"
authors = ["Alistar<codingbulder@gmail.com>"]
description = "Rust Nexus Uploader - Upload packages to Nexus repository"
license = "Apache-2.0"
repository = "https://github.com/it-coder/rnu"
keywords = ["nexus", "npm", "upload", "cli", "repository"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nexus-upload"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
# 关闭默认特性以避免 native-tls：Linux 目标下它会拉入 openssl-sys，
# 交叉编译 / musl 静态链接都要为目标平台准备 OpenSSL。
# rustls-tls-native-roots 仍读取系统信任库，内网 Nexus 的自签 CA 照常有效。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "http2",
    "charset",
    "rustls-tls-native-roots",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 配置文件默认用 TOML（手写友好、可带注释）；--config 指向 .json 时仍按 JSON 读写
toml = "0.8"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "1.0"
colored = "2.0"
indicatif = "0.17"
dirs = "5.0"
urlencoding = "2.1"
flate2 = "1.0"
tar = "0.4"
quick-xml = "0.37"
# 交互式 config init 用，读取密码时不回显
rpassword = "7.3"
# 运行期用于创建隔离的临时 Maven 仓库（--project）
tempfile = "3.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
