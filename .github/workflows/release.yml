name: Release

# 打 v* 标签触发全平台构建并发布；也可手动触发（只构建，不发布）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: 版本与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 Cargo.toml 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          echo "tag=$tag  Cargo.toml=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $tag 与 Cargo.toml 版本 $ver 不一致，先跑 make tag NEW_VERSION=$tag"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all --check

      - name: 单元测试
        run: cargo test --all-targets

  build:
    name: 构建 ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,      target: aarch64-apple-darwin,       cross: false }
          - { os: macos-14,      target: x86_64-apple-darwin,        cross: false }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,  cross: true  }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true  }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    cross: false }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux musl 目标统一走 cross：runner 上没有 musl 专用的 C 工具链，
      # ring（rustls 的加密后端）编译 C 代码时会找 x86_64-linux-musl-gcc 而失败。
      # cross 的镜像里自带 musl-gcc / 链接器，环境由镜像保证。
      - if: matrix.cross
        uses: taiki-e/install-action@cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Windows 上 make 不一定预装，缺失时补装（recipe 本身由 Git Bash 执行）
      - name: 确保 make 可用
        if: runner.os == 'Windows'
        shell: bash
        run: make --version > /dev/null 2>&1 || choco install make -y --no-progress

      - name: 打包
        shell: bash
        run: |
          CARGO_BIN=cargo
          if [ "${{ matrix.cross }}" = "true" ]; then CARGO_BIN=cross; fi
          make package TARGET=${{ matrix.target }} CARGO="$CARGO_BIN"

      - name: 冒烟测试
        shell: bash
        run: |
          bin="$(find dist -name 'nexus-upload*' -type f | head -n1)"
          [ -n "$bin" ] || { echo "::error::未找到可执行文件"; exit 1; }
          # cross 在容器内构建，产物可能属 root，chmod 失败不影响后续读取
          chmod +x "$bin" 2>/dev/null || true
          echo "产物: $bin"

          target="${{ matrix.target }}"
          case "$target" in
            aarch64-*) tarch=aarch64 ;;
            x86_64-*)  tarch=x86_64  ;;
            *)         tarch=unknown ;;
          esac
          host_arch="$(uname -m)"
          [ "$host_arch" = "arm64" ] && host_arch=aarch64

          # 交叉架构的产物无法在当前 runner 上执行，改为校验文件架构
          if [ "$tarch" != "$host_arch" ]; then
            echo "跨架构产物（${target} @ ${host_arch}），跳过执行，校验文件架构"
            info="$(file -b "$bin")"
            echo "$info"
            case "$tarch" in
              aarch64) expect='aarch64|arm64'  ;;
              x86_64)  expect='x86-64|x86_64'  ;;
              *)       expect='.'              ;;
            esac
            if ! printf '%s' "$info" | grep -qE "$expect"; then
              echo "::error::产物架构与目标 ${target} 不符"
              exit 1
            fi
            exit 0
          fi

          "$bin" --version
          "$bin" --help > /dev/null

          # musl 包必须是静态链接，不依赖任何动态库
          # 用 file 判定：新版 glibc 的 ldd 对静态包输出「statically linked」而非
          # 「not a dynamic executable」，grep ldd 会误判
          if [ "${target#*musl}" != "$target" ]; then
            if file "$bin" | grep -q "statically linked"; then
              echo "静态链接校验通过"
            else
              echo "::error::musl 产物不是静态链接"
              file "$bin"
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rnu-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成统一校验和
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 创建或更新 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber \
            || gh release create "$GITHUB_REF_NAME" artifacts/* \
                 --title "$GITHUB_REF_NAME" --generate-notes
